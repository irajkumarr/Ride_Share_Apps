name: shared_core
description: "Shared code for Rider and Driver apps"
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

dependencies:
  cached_network_image: ^4.0.0
  # connectivity_plus: ^7.3.1
  dartz: ^0.10.1
  dio: ^5.11.1
  equatable: ^2.1.0
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  fluttertoast: ^10.0.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^18.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_cropper: ^12.2.1
  image_picker: ^1.2.3
  # internet_connection_checker: ^3.0.1
  internet_connection_checker_plus: ^3.1.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.8.0
  lottie: ^3.6.1
  open_file: ^4.0.0
  device_info_plus: ^13.2.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  pinput: ^6.0.2
  pretty_dio_logger: ^1.4.0
  pull_to_refresh: ^2.0.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  shimmer: ^4.0.0
  stomp_dart_client: ^3.0.1
  toastification: ^3.2.0
  vibration: ^3.2.1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.3
  flutter_polyline_points: ^2.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  flutter_gen_runner: ^5.13.0+1
  freezed: ^4.0.1
  flutter_launcher_icons: ^0.14.4
  envied_generator: ^1.3.7

# Flutter Native Splash
flutter_native_splash:
  color: "#ffffff"
  image: "assets/icons/jci_logo.jpeg"
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

# Flutter Launcher Icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/jci_logo.jpeg"
  adaptive_icon_foreground: "assets/icons/jci_logo.jpeg"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/countryCodes/
    - assets/images/
    - assets/icons/
    - assets/images/branding/
    - assets/images/flags/
    - assets/mapTheme/
    - assets/animation/

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend/Lexend-Black.ttf
          weight: 900
        - asset: assets/fonts/Lexend/Lexend-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lexend/Lexend-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Lexend/Lexend-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Lexend/Lexend-Light.ttf
          weight: 300
        - asset: assets/fonts/Lexend/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend/Lexend-Thin.ttf
          weight: 100
